[package]
name = "space-invaders"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
artbox = "0.2"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
tui-dispatch = { path = "../../tui-dispatch/tui-dispatch", features = ["subscriptions", "json-schema"] }
tui-dispatch-components = { path = "../../tui-dispatch/tui-dispatch-components" }
tui-dispatch-debug = { path = "../../tui-dispatch/tui-dispatch-debug", features = ["subscriptions", "json-schema"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

