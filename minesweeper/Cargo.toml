[package]
name = "minesweeper"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
rand = "0.9"
ratatui = "0.30"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
tui-dispatch = { version = "0.7.1", features = ["subscriptions", "json-schema"] }
tui-dispatch-components = "0.7.1"
tui-dispatch-debug = { version = "0.7.1", features = ["subscriptions", "json-schema"] }
